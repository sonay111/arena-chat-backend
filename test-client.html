<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
  const socket = io("http://localhost:4000");
  const playerId = new URLSearchParams(location.search).get("playerId") || "player_1";
  let conversationId;

  socket.emit("join", { playerId }, (res) => {
    conversationId = res.conversationId;
    console.log("joined as", playerId, "-> conversation", conversationId, "status:", res.status);
  });

  socket.on("history", (messages) => {
    console.log(`--- history (${messages.length} messages) ---`);
    messages.forEach((m) => console.log(`[${m.created_at}] ${m.sender_type}:`, m.body));
    console.log("--- end history ---");
  });

  socket.on("message", (m) => console.log("received:", m.body));  // print incoming

  function send(text) {
    socket.emit("message", {
      conversationId, senderType: "customer", senderId: playerId, body: text
    }, (res) => console.log("server ack:", res.ok));
  }
</script>
