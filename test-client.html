<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
  const socket = io("http://localhost:4000");
  socket.emit("join", { conversationId: 1 });          // join conversation 1
  socket.on("message", (m) => console.log("received:", m.body));  // print incoming
  function send(text) {
    socket.emit("message", {
      conversationId: 1, senderType: "customer", senderId: "test", body: text
    }, (res) => console.log("server ack:", res.ok));
  }
</script>
